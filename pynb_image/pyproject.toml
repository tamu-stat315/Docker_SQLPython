[project]
name = "stat315-course-environment"
version = "2026.9.0"
description = "Reproducible Python and Jupyter environment for STAT 315"
requires-python = ">=3.14,<3.15"
dependencies = [
  "dask[complete]==2026.8.0",
  "dask-ml==2025.1.0",
  "duckdb==1.5.6",
  "graphviz==0.21",
  "ipykernel==7.3.0",
  "ipywidgets>=8.1,<9",
  "jupyterlab==4.6.4",
  "matplotlib==3.11.2",
  "nbconvert>=7.16,<8",
  "notebook==7.6.3",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "psycopg[binary]==3.3.6",
  "pyarrow==25.0.1",
  "pytest==9.1.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "seaborn==0.13.2",
  "sqlalchemy==2.1.1",
  "statsmodels==0.15.0",
]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
